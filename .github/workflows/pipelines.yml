# github actions pipeline for a small, scheduled ETL job.
# Runs daily and publishes run artifacts (no Azure Blob required).

name: Daily ETL (Open-Meteo -> SQLite)

on:
  workflow_dispatch:
  schedule:
    # Runs at 09:00 UTC every day (edit as you like)
    - cron: "0 9 * * *"

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          mkdir -p artifacts
          # Use your script's CLI if it supports it; otherwise just call python api_sql.py
          python api_sql.py --mode daily --db artifacts/weather_grid.sqlite --artifacts-dir artifacts --wind-unit ms

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: artifacts/

    artifact: "run-artifacts"
  displayName: "Publish run artifacts"
